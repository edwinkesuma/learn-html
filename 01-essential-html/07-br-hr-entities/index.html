<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=\, initial-scale=1.0" />
        <title>HTML & CSS</title>
    </head>
    <body>
        <h1>HTML & CSS - Line Break, Horizontal Rule & Entities</h1>

        <!--Line Breaks-->
        Hello <br /><br /><br />
        World

        <!--Horizontal Rules-->
        <p>This is the first paragraph</p>
        <hr />
        <p>This is the second paragraph</p>

        <!--pre tag-->
        <pre>
            Hello           World

                Hello
                    Again
        </pre>

        <!--Code Tag-->
        <code>
            &lt;h1&gt;This is a heading&lt;/h1&gt; <br />
            &copy; <br />
            &reg; <br />
            &trade;<br />
            &deg;<br />
        </code>

        <!--HTML Entities-->
        <!--- &gt; for >
        - &lt; for <
        - &amp; for &
        - &quot; for "
        - &apos; for '
        - &nbps; for Non-breaking space
        - &copy; for ©
        - &reg; for ®
        - &trade; for ™
        - &deg; for ° -->
    </body>
</html>
