<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML & CSS</title>
    </head>
    <body>
        <h1>HTML & CSS - Lists</h1>

        <!--Unordered List-->
        <ul>
            <li>Item One</li>
            <li>Item Two</li>
            <li>Item Three</li>
        </ul>

        <!--Ordered List-->
        <ol>
            <li>Item One</li>
            <li>Item Two</li>
            <li>Item Three</li>
        </ol>

        <!--Nested List-->
        <ul>
            <li>Item One</li>
            <li>Item Two</li>
            <ul>
                <li>Item Three</li>
                <li>Item Four</li>
                <li>Item Five</li>
            </ul>
            <li>Item Six</li>
        </ul>

        <!--Definition List-->
        <dl>
            <dt>Item One</dt>
            <dd>Description one</dd>
            <dt>Item Two</dt>
            <dd>Descriptio Two</dd>
            <dt>Item Three</dt>
            <dd>Description Three</dd>
        </dl>
    </body>
</html>
